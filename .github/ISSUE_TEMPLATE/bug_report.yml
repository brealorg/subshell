name: Bug report
description: Report reproducible incorrect behavior in subshell
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        Do not include Reddit access tokens, refresh tokens, cookies,
        passwords, private messages, or other sensitive account data.

  - type: input
    id: version
    attributes:
      label: subshell version
      description: For example, 0.77.0-beta.1
      placeholder: 0.x.x
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: Android 17
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Pixel 6
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report (optional, but it helps a lot)
      description: |
        subshell can make a short report that shows what the app saw:
        failed Reddit requests and why, notification settings, crashes,
        and your app, Android and device versions. It holds counts and
        short codes only: no usernames, sign-in tokens, cookies or Client ID,
        and no post, comment or message text.

        How to add it:
        1. In subshell, open **Settings › Advanced › Diagnostics**.
        2. If you can, do this right after the problem happened.
           Tap **Report a problem** (or **Create diagnostic report**).
        3. Read the preview. Then tap **Copy diagnostics** and paste it
           below, or tap **Share report** and attach the `.txt` file to
           this issue.

        Tip: **Open prefilled GitHub issue** on the same screen fills in your
        version, Android version and device for you. Come back to the app
        afterwards to copy the report.

        The report becomes public with this issue. Look it over first, and
        leave it out if you would rather not share it.
      placeholder: |
        subshell diagnostic report
        schema=DIAG01A1_V1
        ...
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Screenshots or sanitized logs are useful. Remove private account
        data before attaching them.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed credentials, tokens, cookies, private messages, and other sensitive account data.
          required: true
