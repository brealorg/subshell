name: Bug report
description: Report reproducible incorrect behavior in subshell
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        Do not include Reddit access tokens, refresh tokens, cookies,
        passwords, private messages, or other sensitive account data.

  - type: input
    id: version
    attributes:
      label: subshell version
      description: For example, 0.77.0-beta.1
      placeholder: 0.x.x
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: Android 17
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Pixel 6
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Screenshots or sanitized logs are useful. Remove private account
        data before attaching them.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed credentials, tokens, cookies, private messages, and other sensitive account data.
          required: true
