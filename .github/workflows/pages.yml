name: Publish GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PUBLIC01C12_ALL_HTML_ASSET_CACHE_BUST_V1
      - name: Version static assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          revision = os.environ["GITHUB_SHA"][:12]
          html_files = sorted(Path("site").rglob("*.html"))

          if not html_files:
              raise SystemExit("No HTML files found under site/")

          css_refs = 0
          js_refs = 0

          for path in html_files:
              text = path.read_text(encoding="utf-8")

              css_old = 'href="/subshell/assets/site.css"'
              js_old = 'src="/subshell/assets/site.js"'

              css_count = text.count(css_old)
              js_count = text.count(js_old)

              if css_count > 1 or js_count > 1:
                  raise SystemExit(
                      f"Unexpected duplicate asset reference in {path}"
                  )

              if css_count:
                  text = text.replace(
                      css_old,
                      f'href="/subshell/assets/site.css?v={revision}"',
                      1,
                  )
                  css_refs += 1

              if js_count:
                  text = text.replace(
                      js_old,
                      f'src="/subshell/assets/site.js?v={revision}"',
                      1,
                  )
                  js_refs += 1

              path.write_text(text, encoding="utf-8")

          if css_refs < 4:
              raise SystemExit(
                  f"Expected at least four CSS references; found {css_refs}"
              )

          if js_refs != 1:
              raise SystemExit(
                  f"Expected exactly one JS reference; found {js_refs}"
              )

          print(f"ASSET_REVISION={revision}")
          print(f"CACHE_BUSTED_CSS_PAGES={css_refs}")
          print(f"CACHE_BUSTED_JS_PAGES={js_refs}")
          PY

          REVISION="${GITHUB_SHA:0:12}"

          grep -R -Fq             "/subshell/assets/site.css?v=${REVISION}"             site

          grep -Fq             "/subshell/assets/site.js?v=${REVISION}"             site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
