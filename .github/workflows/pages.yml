name: Publish GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # SECAUDIT19_ACTIONS_PINNED_BY_SHA_V1: actions are pinned to commit
        # SHAs (a moved tag cannot run with pages/id-token write); the comment
        # names the release the SHA was on.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # PUBLIC01C12_ALL_HTML_ASSET_CACHE_BUST_V1
      - name: Version static assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          revision = os.environ["GITHUB_SHA"][:12]
          html_files = sorted(Path("site").rglob("*.html"))

          if not html_files:
              raise SystemExit("No HTML files found under site/")

          css_refs = 0
          js_refs = 0

          for path in html_files:
              text = path.read_text(encoding="utf-8")

              css_old = 'href="/subshell/assets/site.css"'
              js_old = 'src="/subshell/assets/site.js"'

              css_count = text.count(css_old)
              js_count = text.count(js_old)

              if css_count > 1 or js_count > 1:
                  raise SystemExit(
                      f"Unexpected duplicate asset reference in {path}"
                  )

              if css_count:
                  text = text.replace(
                      css_old,
                      f'href="/subshell/assets/site.css?v={revision}"',
                      1,
                  )
                  css_refs += 1

              if js_count:
                  text = text.replace(
                      js_old,
                      f'src="/subshell/assets/site.js?v={revision}"',
                      1,
                  )
                  js_refs += 1

              path.write_text(text, encoding="utf-8")

          if css_refs < 4:
              raise SystemExit(
                  f"Expected at least four CSS references; found {css_refs}"
              )

          # PUBLIC02_SITE_REFRESH_V1: every page loads the palette toggle script.
          if js_refs < 4:
              raise SystemExit(
                  f"Expected at least four JS references; found {js_refs}"
              )

          print(f"ASSET_REVISION={revision}")
          print(f"CACHE_BUSTED_CSS_PAGES={css_refs}")
          print(f"CACHE_BUSTED_JS_PAGES={js_refs}")
          PY

          REVISION="${GITHUB_SHA:0:12}"

          grep -R -Fq             "/subshell/assets/site.css?v=${REVISION}"             site

          grep -Fq             "/subshell/assets/site.js?v=${REVISION}"             site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
